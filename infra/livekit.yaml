# Конфигурация LiveKit Server для VPS 2 vCPU / 3 ГБ RAM (со встроенным TURN).
# Безсекретный шаблон. `node infra/generate-secrets.mjs --write` создаёт
# игнорируемый `livekit.runtime.yaml`, который использует Compose.

port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true

turn:
  enabled: true
  udp_port: 3478
  tls_port: 5349
  # Домен должен совпадать с LIVEKIT_DOMAIN из .env
  domain: LIVEKIT_DOMAIN_PLACEHOLDER

keys:
  # При генерации заменяется блоком из LIVEKIT_API_KEY и LIVEKIT_API_SECRET.
  API_KEY_PLACEHOLDER: API_SECRET_PLACEHOLDER

webhook:
  api_key: API_KEY_PLACEHOLDER
  urls:
    - http://caddy:8000/functions/v1/livekit-webhook

logging:
  level: info
