appId: com.openger.app
name: Низ облачка — время вместо «Отправляется…»
tags:
  - chats
env:
  CHAT: Plany
---
- runFlow: subflows/open-app.yaml
- tapOn: ${CHAT}
# Счётчик просмотров здесь не проверяется: он есть, только если сообщение
# кто-то уже посмотрел, а это зависит от того, что лежит внизу чата.
# Показ и скрытие счётчика — в MessageBubble.test.tsx.
- assertVisible:
    id: "messages-list"
- evalScript: ${output.msg = 'maestro-' + Date.now()}
- tapOn: "Сообщение"
- inputText: ${output.msg}
- tapOn: "Отправить"
- assertVisible: ${output.msg}
# Доставку показывает само время: текста «Отправляется…» нет нигде.
- assertNotVisible: "Отправляется…"
- extendedWaitUntil:
    visible:
      id: "message-time"
    timeout: 10000
# Убрать за собой.
- longPressOn: ${output.msg}
- tapOn: "Удалить"
- assertVisible: "Удалить сообщение?"
- tapOn: "Удалить"
- assertNotVisible: ${output.msg}
