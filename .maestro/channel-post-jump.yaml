appId: com.openger.app
name: Переход к посту канала из диалога — экран канала, «Посты», тот же экземпляр
tags:
  - channels
  - chats
env:
  CHANNEL: Test Kanal
  CHAT: Plany
---
- runFlow: subflows/open-app.yaml
- runFlow:
    file: subflows/open-chat.yaml
    env:
      CHAT: ${CHANNEL}
- evalScript: ${output.post = 'maestro-' + Date.now()}
- tapOn: "Сообщение"
- inputText: ${output.post}
- tapOn: "Отправить"
- assertVisible: ${output.post}
# Пересылка в диалог из листа «Кому переслать»: лист закрывается, человек — снова в канале.
- longPressOn:
    text: ${output.post}
    childOf:
      id: "messages-list"
- tapOn: "Переслать"
- tapOn: ${CHAT}
- tapOn:
    id: "forward-send"
- assertVisible:
    id: "segment-0"
- back
# «Чаты» помнят, докуда их прокрутили к каналу: сначала — к началу списка.
- scrollUntilVisible:
    element:
      id: "saved-entry"
    direction: UP
    timeout: 20000
- runFlow: subflows/open-chat.yaml
- assertVisible:
    id: "call-button"
- assertVisible: ${output.post}
# Переписка догружается и сдвигается: долгое нажатие — когда она встала.
- waitForAnimationToEnd:
    timeout: 5000
# «Перейти к оригиналу» у облачка островка — к посту на экране канала, раздел «Посты».
- longPressOn:
    text: ${output.post}
    childOf:
      id: "messages-list"
- tapOn: "Перейти к оригиналу"
- assertVisible:
    id: "segment-0"
    selected: true
- assertVisible: ${output.post}
# Канал встал поверх диалога одним экземпляром: «назад» — в диалог.
- back
- assertVisible:
    id: "call-button"
# Уборка: островок — из диалога, пост удаляется в канале.
- longPressOn:
    text: ${output.post}
    childOf:
      id: "messages-list"
- tapOn: "Убрать из пересылки"
- tapOn: "Убрать"
- extendedWaitUntil:
    notVisible:
      text: ${output.post}
      childOf:
        id: "messages-list"
    timeout: 10000
- back
- runFlow:
    file: subflows/open-chat.yaml
    env:
      CHAT: ${CHANNEL}
- longPressOn:
    text: ${output.post}
    childOf:
      id: "messages-list"
- tapOn: "Удалить"
- tapOn: "Удалить"
- assertNotVisible: ${output.post}
