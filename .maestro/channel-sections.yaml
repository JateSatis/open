appId: com.openger.app
name: Канал — «Посты» и «Попсы» переключаются тапом по сегменту и свайпом
env:
  CHANNEL: Test Kanal
---
- runFlow: subflows/open-app.yaml
- tapOn: ${CHANNEL}
- assertVisible:
    id: "section-pager"
- assertVisible:
    id: "messages-list"
- tapOn:
    id: "segment-1"
- assertVisible: "Попсов пока нет"
- tapOn:
    id: "segment-0"
- assertVisible:
    id: "messages-list"
# Свайп влево по постам уводит к «Попсам», вправо — обратно.
- swipe:
    start: "85%,40%"
    end: "15%,41%"
    duration: 300
- assertVisible: "Попсов пока нет"
- swipe:
    start: "15%,40%"
    end: "85%,41%"
    duration: 300
- assertVisible:
    id: "messages-list"
