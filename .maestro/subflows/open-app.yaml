appId: com.openger.app
---
# Приложение уже загружено — ссылка сбрасывает стек на список чатов без перезагрузки
# бандла. Не загружено (или висит ошибка dev-клиента) — холодный старт.
- openLink: "openger://chats"
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      notVisible:
        id: "chat-list-item"
    file: restart-app.yaml
# Ждём строки списка, а не заголовок «Чаты»: заголовок рисуется раньше данных, и тап по
# чату сразу после него промахивался.
- extendedWaitUntil:
    visible:
      id: "chat-list-item"
    timeout: 90000
