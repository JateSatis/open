appId: com.openger.app
---
# Чат ${CHAT} из списка «Чатов»: докрутить до него, а не надеяться, что он на
# первом экране. Свежая активность в других чатах (тестовые чаты, переписка
# на втором устройстве) сдвигает его ниже.
- scrollUntilVisible:
    element: ${CHAT}
    direction: DOWN
    timeout: 20000
- tapOn: ${CHAT}
