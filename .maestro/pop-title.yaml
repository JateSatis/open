appId: com.openger.app
name: Новый поп — поле «Название» над подписью, без названия «Опубликовать» не публикует и объясняет почему
tags:
  - pops
  - media
env:
  CHANNEL: Test Kanal
---
# Ничего не публикует: удаления попа в приложении нет, а каждый прогон оставлял бы поп
# в канале и файл в Storage. Публикация с названием проверена тестами редактора.
# В галерее должно быть тестовое вертикальное видео open-test-pop.mp4 (0:06): выбор —
# по длительности, а не первой плиткой: другие сценарии кладут в галерею свои фото и видео.
- runFlow: subflows/open-app.yaml
- tapOn: ${CHANNEL}
- tapOn:
    id: "segment-1"
- tapOn:
    id: "pop-add-tile"
- tapOn: "Выбрать видео"
- tapOn: "0:06"
- assertVisible:
    id: "pop-title"
- assertVisible:
    id: "pop-caption"
- assertNotVisible:
    id: "pop-title-required"
- tapOn: "Опубликовать"
- assertVisible:
    id: "pop-title-required"
# Редактор не закрылся: поп не ушёл.
- assertVisible:
    id: "pop-title"
- tapOn:
    id: "pop-title"
- inputText: "Elka"
- assertNotVisible:
    id: "pop-title-required"
- hideKeyboard
- tapOn:
    id: "pop-editor-back"
- assertVisible:
    id: "pops-section"
