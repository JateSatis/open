appId: com.openger.app
name: Закреп комментария к попу владельцем канала — метка «Закреплено автором», открепление, у ответа пунктов нет
tags:
  - comments
  - pops
  - channels
  - video
env:
  CHANNEL: Pop Lab
---
- runFlow: subflows/open-app.yaml
- tapOn: ${CHANNEL}
- tapOn:
    id: "segment-1"
- tapOn:
    id: "pop-tile"
    index: 0
- assertVisible:
    id: "pop-page-active"
- tapOn:
    id: "pop-comments"
- assertVisible:
    id: "comments-panel"
# Свой комментарий: владелец канала закрепляет и свой, и чужой.
- evalScript: ${output.msg = 'maestro-pin-' + Date.now()}
- tapOn: "Комментарий"
- inputText: ${output.msg}
- tapOn: "Отправить"
- assertVisible: ${output.msg}
- tapOn: ${output.msg}
- tapOn: "Закрепить"
- assertVisible:
    id: "comment-pinned-label"
- assertVisible: "Закреплено автором"
# Ответ в ветке закрепить нельзя.
- evalScript: ${output.reply = 'maestro-reply-' + Date.now()}
- swipe:
    from: ${output.msg}
    direction: LEFT
- inputText: ${output.reply}
- tapOn: "Отправить"
- assertVisible: ${output.reply}
- tapOn: ${output.reply}
- assertVisible: "Ответить"
- assertNotVisible: "Закрепить"
- assertNotVisible: "Открепить"
- back
- back
# Открепление — метка уходит, комментарий остаётся.
- tapOn: ${output.msg}
- tapOn: "Открепить"
- assertNotVisible:
    id: "comment-pinned-label"
- assertVisible: ${output.msg}
# Уборка: свой комментарий удаляется вместе с ответом в ветке.
- tapOn: "1 ответ"
- tapOn: ${output.reply}
- tapOn: "Удалить"
- tapOn: "Удалить"
- assertNotVisible: ${output.reply}
- back
- tapOn: ${output.msg}
- tapOn: "Удалить"
- tapOn: "Удалить"
- assertNotVisible: ${output.msg}
