appId: com.openger.app
name: Публичная ссылка открывает канал поверх переписки и сохраняет путь назад в «Чаты»
tags:
  - chats
  - channels
env:
  CHAT: Plany
---
- runFlow: subflows/open-app.yaml
- runFlow: subflows/open-chat.yaml
- assertVisible: "О чате: ${CHAT}"

- openLink: openger://c/subs_test_zz
- assertVisible: "О канале: Канал подписок"
# Android может оставить вкладки фонового списка в дереве. Сохраняем наблюдение
# и проверяем его в конце, чтобы в отчёте остался результат обоих возвратов.
- runFlow:
    when:
      visible:
        id: "tab-bar"
    commands:
      - evalScript: ${output.tabsInChannel = true}

- back
- assertNotVisible: "О канале: Канал подписок"
- assertVisible: "О чате: ${CHAT}"
- runFlow:
    when:
      visible:
        id: "tab-bar"
    commands:
      - evalScript: ${output.tabsInChat = true}

- back
- assertNotVisible: "О чате: ${CHAT}"
- assertVisible:
    id: "chats-search-open"
- assertVisible:
    id: "tab-bar"
- assertTrue:
    condition: ${!output.tabsInChannel}
    label: Панель вкладок скрыта в канале
- assertTrue:
    condition: ${!output.tabsInChat}
    label: Панель вкладок скрыта в переписке
