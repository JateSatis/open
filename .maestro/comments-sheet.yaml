appId: com.openger.app
name: Шит комментариев из меню «Комментировать» — сообщение остаётся в переписке, закрытие свайпом и тапом над шитом
tags:
  - smoke
  - comments
  - chats
env:
  CHAT: Plany
---
- runFlow: subflows/open-app.yaml
- tapOn: ${CHAT}
# Участник: у сообщения без комментариев круга нет — первый пишут из меню.
- longPressOn:
    id: "message-time"
    index: 0
- tapOn: "Комментировать"
- assertVisible:
    id: "comments-panel"
# Сообщение не поднимается над шитом: копии нет.
- assertNotVisible:
    id: "comments-lifted-message"
- swipe:
    from:
      id: "comments-sheet-header"
    direction: DOWN
- assertNotVisible:
    id: "comments-panel"
- longPressOn:
    id: "message-time"
    index: 0
- tapOn: "Комментировать"
- assertVisible:
    id: "comments-panel"
# Тап по затемнению над шитом (верх шита — на четверти экрана) закрывает
# его, как «назад».
- tapOn:
    point: "50%,15%"
- assertNotVisible:
    id: "comments-panel"
