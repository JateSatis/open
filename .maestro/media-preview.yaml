appId: com.openger.app
name: Шит медиа — тап по плитке открывает предпросмотр, кружок в шапке выбирает, «назад» возвращает в шит
env:
  CHAT: Plany
---
- runFlow: subflows/open-app.yaml
- tapOn: ${CHAT}
- assertVisible:
    id: "messages-list"
- tapOn: "Фото и видео"
- assertVisible:
    id: "media-grid"
# Тап по самой плитке (не по кружку) — предпросмотр, выбор не меняется.
- tapOn:
    id: "media-grid-open"
    index: 3
- assertVisible:
    id: "media-preview"
- assertVisible:
    id: "media-preview-tool-color"
# Кружок в шапке выбирает текущий файл первым номером и снимает выбор.
- tapOn:
    id: "media-preview-select"
- assertVisible: "Убрать из выбранного"
- tapOn:
    id: "media-preview-select"
- assertVisible: "Выбрать файл"
# Инструмент цвета открывается и закрывается крестиком.
- tapOn:
    id: "media-preview-tool-color"
- assertVisible: "Экспозиция"
- tapOn:
    id: "media-preview-tool-cancel"
- assertNotVisible: "Экспозиция"
# Обрезка: поворот на 90° → «Готово» — иконка обрезки подсвечена, фото выбрано.
- tapOn:
    id: "media-preview-tool-crop"
- assertVisible:
    id: "crop-rotate"
- tapOn:
    id: "crop-rotate"
- assertVisible:
    id: "media-preview-tool-reset"
- tapOn:
    id: "media-preview-tool-done"
- assertNotVisible:
    id: "crop-rotate"
- assertVisible:
    id: "media-preview-tool-crop"
    selected: true
- assertVisible: "Убрать из выбранного"
# Выбор снимается — правки остаются до сброса выбора; на выходе из чата
# сбросятся вместе с ним.
- tapOn:
    id: "media-preview-select"
# «Назад» возвращает в шит, а не закрывает его.
- tapOn:
    id: "media-preview-back"
- assertNotVisible:
    id: "media-preview"
- assertVisible:
    id: "media-grid"
- back
- assertNotVisible:
    id: "media-grid"
