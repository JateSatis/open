appId: com.openger.app
name: Шит медиа — тап по плитке открывает предпросмотр, кружок в шапке выбирает, «назад» возвращает в шит
env:
  CHAT: Plany
---
- runFlow: subflows/open-app.yaml
- tapOn: ${CHAT}
- assertVisible:
    id: "messages-list"
- tapOn: "Фото и видео"
- assertVisible:
    id: "media-grid"
# Тап по самой плитке (не по кружку) — предпросмотр, выбор не меняется.
- tapOn:
    id: "media-grid-open"
    index: 3
- assertVisible:
    id: "media-preview"
- assertVisible:
    id: "media-preview-tool-color"
# Кружок в шапке выбирает текущий файл первым номером и снимает выбор.
- tapOn:
    id: "media-preview-select"
- assertVisible: "Убрать из выбранного"
- tapOn:
    id: "media-preview-select"
- assertVisible: "Выбрать файл"
# Инструмент цвета открывается и закрывается крестиком.
- tapOn:
    id: "media-preview-tool-color"
- assertVisible: "Экспозиция"
- tapOn:
    id: "media-preview-tool-cancel"
- assertNotVisible: "Экспозиция"
# Обрезка: поворот на 90° → «Готово» — иконка обрезки подсвечена, фото выбрано.
- tapOn:
    id: "media-preview-tool-crop"
- assertVisible:
    id: "crop-rotate"
- tapOn:
    id: "crop-rotate"
- assertVisible:
    id: "media-preview-tool-reset"
- tapOn:
    id: "media-preview-tool-done"
- assertNotVisible:
    id: "crop-rotate"
- assertVisible:
    id: "media-preview-tool-crop"
    selected: true
- assertVisible: "Убрать из выбранного"
# Рисование: до штриха в этом заходе крестику нечего отменять; штрих →
# «отменить» → снова нечего → штрих → «Готово» — иконка рисования
# подсвечена. Крестик, а не стрелка: рисунок прошлого прогона на этом фото
# стрелка тоже умеет снимать.
- tapOn:
    id: "media-preview-tool-draw"
- assertVisible:
    id: "draw-brush-pen"
- assertVisible:
    id: "draw-cancel"
    enabled: false
- tapOn:
    id: "draw-brush-pen"
- swipe:
    start: 30%, 45%
    end: 70%, 50%
    duration: 400
- assertVisible:
    id: "draw-cancel"
    enabled: true
- tapOn:
    id: "draw-undo"
- assertVisible:
    id: "draw-cancel"
    enabled: false
- swipe:
    start: 30%, 55%
    end: 70%, 50%
    duration: 400
# Цвет: кружок → панель цвета; системное «назад» закрывает только панель.
# Снова кружок → цвет из сетки (середина сетки) → панель закрыта → штрих им.
- tapOn:
    id: "draw-color"
- assertVisible:
    id: "draw-eyedropper"
- back
- assertNotVisible:
    id: "draw-eyedropper"
- assertVisible:
    id: "draw-brush-pen"
- tapOn:
    id: "draw-color"
- tapOn:
    id: "draw-palette"
- assertNotVisible:
    id: "draw-eyedropper"
- swipe:
    start: 30%, 40%
    end: 70%, 35%
    duration: 400
- tapOn:
    id: "media-preview-tool-done"
- assertNotVisible:
    id: "draw-brush-pen"
- assertVisible:
    id: "media-preview-tool-draw"
    selected: true
# Выбор снимается — правки остаются до сброса выбора; на выходе из чата
# сбросятся вместе с ним.
- tapOn:
    id: "media-preview-select"
# «Назад» возвращает в шит, а не закрывает его.
- tapOn:
    id: "media-preview-back"
- assertNotVisible:
    id: "media-preview"
- assertVisible:
    id: "media-grid"
- back
- assertNotVisible:
    id: "media-grid"
