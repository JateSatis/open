appId: com.openger.app
name: «О чате» группы — тап по шапке, имя @…di задать и стереть, точка не принимается
tags:
  - chats
env:
  # Группа, где основной аккаунт — единственный участник. Имя `maestro_NNNN` короткое:
  # тап ставит курсор в центр поля, и длинное имя стёрлось бы не целиком.
  CHAT_ID: 4a84d022-7365-4764-8030-56608feff9f9
  TITLE: "Тест: взгляд посетителя"
---
- runFlow: subflows/open-app.yaml
- openLink: openger://chats/${CHAT_ID}
- assertVisible:
    id: "messages-list"
- tapOn: "О чате: ${TITLE}"
- assertVisible: "О чате"
- assertVisible:
    id: "chat-username-suffix"
    text: ".di"
# Имя от прерванного прогона — сначала стереть.
- runFlow:
    when:
      visible:
        id: "chat-info-username"
    commands:
      - tapOn:
          id: "chat-username"
      - eraseText: 30
      - tapOn:
          id: "chat-username-save"
      - assertNotVisible:
          id: "chat-info-username"
# Точка — ошибка, сохранить нельзя.
- tapOn:
    id: "chat-username"
- inputText: "a.b"
- assertVisible: "Точка в имени недопустима"
- eraseText: 10
- evalScript: ${output.name = 'maestro_' + String(Date.now()).slice(-4)}
- inputText: ${output.name}
- assertVisible: "Имя свободно"
- tapOn:
    id: "chat-username-save"
- assertVisible:
    id: "chat-info-username"
    text: "@${output.name}.di"
# Стереть — строки с @ больше нет.
- tapOn:
    id: "chat-username"
- eraseText: 30
- tapOn:
    id: "chat-username-save"
- assertNotVisible:
    id: "chat-info-username"
# «Назад» — в переписку.
- hideKeyboard
- back
- assertVisible:
    id: "messages-list"
