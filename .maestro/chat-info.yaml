appId: com.openger.app
name: Страница группы — тап по шапке, «Изменить» @…di задать и стереть, точка не принимается, назад в переписку
tags:
  - chats
env:
  # Группа, где основной аккаунт — единственный участник. Имя `maestro_NNNN` короткое:
  # тап ставит курсор в центр поля, и длинное имя стёрлось бы не целиком.
  CHAT_ID: 4a84d022-7365-4764-8030-56608feff9f9
  TITLE: "Тест: взгляд посетителя"
---
- runFlow: subflows/open-app.yaml
- openLink: openger://chats/${CHAT_ID}
- assertVisible:
    id: "messages-list"
- tapOn: "О чате: ${TITLE}"
- assertVisible:
    id: "info-title"
    text: ${TITLE}
- assertVisible: "1 участник"
- assertVisible:
    id: "info-tab-members"
# Имя от прерванного прогона — сначала стереть.
- runFlow:
    when:
      visible:
        id: "info-group-username"
    commands:
      - tapOn:
          id: "info-edit"
      - tapOn:
          id: "chat-username"
      - eraseText: 30
      - tapOn:
          id: "chat-edit-save"
      - assertNotVisible:
          id: "info-group-username"
- tapOn:
    id: "info-edit"
- assertVisible:
    id: "chat-edit-save"
# Точка — ошибка, сохранить нельзя.
- tapOn:
    id: "chat-username"
- inputText: "a.b"
- assertVisible: "Точка в имени недопустима"
- eraseText: 10
- evalScript: ${output.name = 'maestro_' + String(Date.now()).slice(-4)}
- inputText: ${output.name}
- assertVisible: "Имя свободно"
- tapOn:
    id: "chat-edit-save"
    retryTapIfNoChange: true
# Сохранили — страница сразу с новым именем.
- assertVisible:
    id: "info-group-username"
    text: "@${output.name}.di, Имя группы"
# Стереть — строки с @ больше нет, а карточки без строк нет вовсе.
- tapOn:
    id: "info-edit"
- tapOn:
    id: "chat-username"
- eraseText: 30
- tapOn:
    id: "chat-edit-save"
- assertNotVisible:
    id: "info-group-username"
# Стрелка назад — в ту же переписку.
- tapOn:
    id: "info-back"
- assertVisible:
    id: "messages-list"
